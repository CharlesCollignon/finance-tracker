name: CI

# The owner merges locally and pushes to main, so the push trigger below is
# the one that matters most in practice. pull_request is kept for anyone
# opening PRs, and workflow_dispatch lets this be run by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: Typecheck, reachability, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm must be on PATH before actions/setup-node's cache:pnpm step,
      # because setup-node shells out to `pnpm store path` to find the cache
      # directory. Doing this the other way round is a common failure mode.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # No version pinned here: pnpm/action-setup reads it from this
        # repo's package.json "packageManager" field (pnpm@11.7.0).

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          # Pinned to 20 to match local development: local Node is v20.20.2
          # and there is no .nvmrc. NOTE: @supabase/supabase-js emits a
          # deprecation warning on Node 20 and wants Node 22. Flagging this
          # only - changing the CI/runtime Node version is the owner's call,
          # not something to fold into a CI-workflow commit.
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web
        run: pnpm --filter web exec tsc --noEmit

      - name: Typecheck mobile
        run: pnpm --filter mobile exec tsc --noEmit

      - name: Reachability check
        run: pnpm check:reachability

      # ---------------------------------------------------------------
      # Test suite, with one known-failing file excluded.
      #
      # packages/core/src/still-to-come.test.ts > "totals exactly the gap
      # between the current and month-end views" currently fails
      # (expected 610 to be close to 520). This is long pre-existing and
      # predates all recent work; it is a separate, un-made decision for
      # the owner, not something fixed as part of adding CI.
      #
      # Excluding the whole file (rather than leaving it in and accepting
      # a red job) means the other 1238 passing tests in the suite (of the
      # 1249 that currently pass; the other 11 live alongside the failing
      # assertion in this same file) are actually watched by CI, instead of
      # the whole suite going unwatched because of one broken assertion.
      #
      # Remove this --exclude once still-to-come.test.ts is fixed, so the
      # full suite (including that file) runs unconditionally again.
      # ---------------------------------------------------------------
      - name: Test (packages/core, with still-to-come.test.ts excluded)
        run: pnpm --filter @finance/core exec vitest run --exclude '**/still-to-come.test.ts'

# ---------------------------------------------------------------------
# Gates NOT run by this workflow, and why, as measured on 2026-09-19:
#
# 1. `pnpm --filter @finance/core exec tsc --noEmit`
#    Fails with exactly one error:
#      src/push-routes.test.ts(89,15): TS2353 - 'share' does not exist in
#      type 'BudgetProgress'.
#    Pre-existing. Fix the type mismatch (or the test), then add this
#    step back.
#
# 2. `pnpm --filter web lint`
#    Fails with 9 errors, 2 warnings, all react-hooks/set-state-in-effect
#    and react-hooks/refs findings in files unrelated to recent work.
#    Fix (or explicitly suppress) those findings, then add this step back.
#
# 3. `pnpm --filter mobile lint`
#    Fails with 42 problems (11 errors, 31 warnings) of a similar
#    character to the web lint failures.
#    Fix (or explicitly suppress) those findings, then add this step back.
#
# 4. The one excluded test file, see the comment above the test step:
#    packages/core/src/still-to-come.test.ts (1 failing assertion out of
#    12 tests in that file). Fix the assertion, then drop the --exclude.
#
# None of these are fixed here: this workflow only wires up gates that
# already pass, plus the test suite minus its one known-failing file, so
# CI is green from its first run instead of training everyone to ignore
# a red badge.
# ---------------------------------------------------------------------
