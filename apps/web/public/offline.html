<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Pluclair</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #f8f9fb;
        color: #16161d;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a10; color: #ececf1; }
      }
      main { max-width: 30rem; display: flex; flex-direction: column; gap: 0.75rem; }
      h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
      p { margin: 0; line-height: 1.6; opacity: 0.75; }
      button {
        margin-top: 0.5rem;
        padding: 0.7rem 1.25rem;
        border: 0;
        border-radius: 0.5rem;
        background: #4f2fd0;
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection</h1>
      <p>
        Pluclair needs the network to read your figures. Anything you entered
        while offline is saved on this device and will sync by itself once you
        are back.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
